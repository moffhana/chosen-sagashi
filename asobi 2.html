<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>

<script>
(function () {
'use strict';
const app = document.getElementById('app');
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };

const wait = ms => new Promise(r => setTimeout(r, ms));
function say(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = .95; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {} }

/* ---------- sound (small synth; all tunes are original placeholders) ---------- */
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function tone(f, t, d, type, v) {

const sfx = {
  pop: () => { tone(660, 0, .12, 'triangle', .12); tone(990, .05, .15, 'triangle', .08); },
  yay: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .3, 'triangle', .1)),
  no: () => { tone(330, 0, .2, 'square', .05); tone(262, .15, .3, 'square', .05); },
  beep: () => tone(880, 0, .12, 'sine', .1),

const INST = {
  celesta: () => [1319, 1568, 1319, 1175, 1047].forEach((f, i) => setTimeout(() => sfx.bell(f), i * 220)),
  harp: () => [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * .08, .9, 'triangle', .08)),
  trumpet: () => [523, 523, 659, 784].forEach((f, i) => { tone(f, i * .25, .22, 'sawtooth', .05); tone(f, i * .25, .22, 'square', .025); }),
  drum: () => [0, .3, .45, .6].forEach(t => { tone(90, t, .3, 'sine', .25); noise(t, .08, .06); }),
  castanet: () => [0, .12, .24, .48, .6].forEach(t => { tone(2600, t, .03, 'square', .06); noise(t, .03, .12); })

const TUNES = {
  spain: () => { INST.castanet(); [440, 523, 494, 440, 415, 440].forEach((f, i) => tone(f, .2 + i * .22, .2, 'triangle', .1)); },
  arabia: () => [294, 311, 370, 392, 370, 311, 294].forEach((f, i) => tone(f, i * .35, .45, 'triangle', .09)),
  china: () => [784, 880, 1047, 1175, 1047, 880].forEach((f, i) => sfx.bell(f) || tone(f, i * .18, .2, 'sine', .0)) || [784, 880, 1047, 1175, 1047, 880].forEach((f, i) => setTimeout(() => sfx.bell(f), i * 180)),
  russia: () => [392, 392, 440, 494, 523, 494, 440, 392, 523, 587].forEach((f, i) => tone(f, i * .13, .12, 'square', .05))
};

function confetti() {
  if (REDUCE) return;
  const c = h('div', 'confetti'); const cols = ['#F2C46D', '#F29BB7', '#8FB7F2', '#7BE0A8', '#fff'];
  for (let i = 0; i < 40; i++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = cols[i % 5]; p.style.animationDelay = Math.random() * .4 + 's'; p.style.animationDuration = 1.2 + Math.random() * .9 + 's'; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(() => c.remove(), 2600);
}
/* ---------- the dancer figure (shared with the ballet quiz) ---------- */
const SVGNS = 'http://www.w3.org/2000/svg';
const rad = d => d * Math.PI / 180;
const dir = (a, len) => [Math.sin(rad(a)) * len, Math.cos(rad(a)) * len];
const L = { thigh: 40, shin: 40, up: 26, fore: 24, torso: 44 };
const BASE = { x: 0, y: 0, lean: 0, sx: 1, lT: 0, lS: 0, lF: -92, rT: 0, rS: 0, rF: 92, lU: -12, lA: 25, rU: 12, rA: -25, side: 0 };
function figure(p) {
  p = Object.assign({}, BASE, p);
  const H = [100 + p.x, 128 + p.y];
  const td = dir(180 + p.lean, L.torso);
  const S = [H[0] + td[0], H[1] + td[1]];
  const hd = dir(180 + p.lean, 15);
  const head = [S[0] + hd[0], S[1] + hd[1]];
  const side = p.side; /* 1 = seen from the side (facing right) */
  const hipOff = side ? 2 : 7, shOff = side ? 2 : 11;
  const lHip = [H[0] - hipOff, H[1]], rHip = [H[0] + hipOff, H[1]];
  const lSh = [S[0] - shOff, S[1] + 3], rSh = [S[0] + shOff, S[1] + 3];
  const chain = (o, a1, l1, a2, l2) => { const d1 = dir(a1, l1), m = [o[0] + d1[0], o[1] + d1[1]]; const d2 = dir(a2, l2), e = [m[0] + d2[0], m[1] + d2[1]]; return [o, m, e]; };
  const lLeg = chain(lHip, p.lT, L.thigh, p.lS, L.shin), rLeg = chain(rHip, p.rT, L.thigh, p.rS, L.shin);
  const lArm = chain(lSh, p.lU, L.up, p.lA, L.fore), rArm = chain(rSh, p.rU, L.up, p.rA, L.fore);
  const foot = (ank, a) => { const d = dir(a, 12); return [ank, [ank[0] + d[0], ank[1] + d[1]]]; };
  const pl = pts => pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
  const limb = (pts, col, w, op) => `<polyline points="${pl(pts)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${op ? ` opacity="${op}"` : ''}/>`;
  /* in side view the left limbs are behind: draw them paler */
  const back = side ? .55 : 1;
  const tutuTilt = side ? -p.lean * .6 : 0;
  const bun = side ? [head[0] - 10, head[1] - 2] : [head[0], head[1] - 12];
  return `<g transform="translate(${100 + p.x} 0) scale(${p.sx} 1) translate(${-(100 + p.x)} 0)">
    <ellipse cx="${H[0]}" cy="212" rx="${34 + p.y * .25}" ry="6" fill="#3B2620" opacity=".08"/>
    ${limb(lArm, 'var(--skin)', 6.5, back)}
    ${limb(lLeg.concat([foot(lLeg[2], p.lF)[1]]), 'var(--tights)', 8, back)}
    ${limb(rLeg.concat([foot(rLeg[2], p.rF)[1]]), 'var(--tights)', 8)}
    ${limb([H, S], 'var(--leo)', 20)}
    <ellipse cx="${H[0]}" cy="${H[1] - 2}" rx="${side ? 24 : 30}" ry="6.5" fill="#FBE3EA" stroke="#F0B9C8" stroke-width="1.5" transform="rotate(${tutuTilt} ${H[0]} ${H[1]})"/>
    <line x1="${S[0]}" y1="${S[1]}" x2="${head[0]}" y2="${head[1]}" stroke="var(--skin)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="${bun[0]}" cy="${bun[1]}" r="6" fill="var(--hair)"/>
    <circle cx="${head[0]}" cy="${head[1]}" r="11" fill="var(--skin)"/>
    <path d="M ${head[0] - 11} ${head[1] - 1} A 11 11 0 0 1 ${head[0] + 11} ${head[1] - 1} Q ${head[0]} ${head[1] - 6} ${head[0] - 11} ${head[1] - 1} Z" fill="var(--hair)"/>
    ${limb(rArm, 'var(--skin)', 6.5)}
  </g>`;
}
/* ---------- feet seen from above ---------- */
const FOOT = 'M -8 0 C -10 -14 -12 -30 -12 -44 C -12 -60 14 -62 14 -46 C 14 -32 11 -14 8 0 C 5 7 -5 7 -8 0 Z';
function feet(n) {
  /* [heelX, heelY, rotation] for back/left foot and front/right foot; rotation 90 = toes to the right */
  const F = {
    1: [[96, 112, -86], [104, 112, 86]],
    2: [[66, 112, -86], [134, 112, 86]],
    3: [[132, 98, -86], [100, 120, 86]],
    4: [[134, 76, -86], [66, 136, 86]],
    5: [[134, 98, -86], [66, 120, 86]]

  const toes = [[-8, -52, 3.4], [-3, -56, 3.6], [2.5, -56, 3.4], [7, -53, 3.1], [10.5, -49, 2.7]].map(([tx, ty, r]) => `<circle cx="${tx}" cy="${ty}" r="${r}" fill="#fff" opacity=".7"/>`).join('');
  const f = ([x, y, r], col) => `<g transform="translate(${x} ${y}) rotate(${r})"><path d="${FOOT}" fill="${col}" stroke="#B9788A" stroke-width="2"/>${toes}</g>`;
  return `<rect x="0" y="0" width="200" height="200" fill="#FFF8F2"/>
    <text x="100" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#8A6A5C">うえから みた あし</text>
    <g transform="translate(100 106) scale(1.35) translate(-100 -106)">${f(F[0], '#F7C6D2')}${f(F[1], '#F2A9BC')}</g>
    <text x="100" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#8A6A5C">▼ まえ（おきゃくさん）</text>`;
}

/* ---------- poses ---------- */
const P = {
  bas: {},
  avant: { lU: -60, lA: 95, rU: 60, rA: -95 },
  seconde: { lU: -76, lA: -86, rU: 76, rA: 86 },
  haut: { lU: -150, lA: 150, rU: 150, rA: -150 },
  plie: { y: 15, lT: -35, lS: 35, rT: 35, rS: -35, lU: -76, lA: -86, rU: 76, rA: 86 },
  releve: { y: -11, lF: -14, rF: 14, lU: -150, lA: 150, rU: 150, rA: -150 },
  /* side view (facing right) */
  sStand: { side: 1, lF: 90, rF: 90, lU: -8, lA: 10, rU: 8, rA: 20, lT: 0, rT: 0 },
  tendu: { side: 1, lF: 90, rT: 25, rS: 25, rF: 42, lU: -80, lA: -88, rU: 60, rA: 80 },
  passe: { y: -4, lT: 0, lS: 0, lF: -30, rT: 60, rS: -66, rF: -66, lU: -60, lA: 95, rU: 60, rA: -95 },
  arab: { side: 1, lean: -12, lF: 90, rT: -92, rS: -92, rF: -96, lU: 122, lA: 112, rU: -98, rA: -96 },
  att: { side: 1, lean: -8, lF: 90, rT: -128, rS: -72, rF: -66, lU: -96, lA: -90, rU: 168, rA: 150 },
  jeteUp: { side: 1, y: -46, lean: -8, lT: -86, lS: -88, lF: -92, rT: 86, rS: 88, rF: 92, lU: -110, lA: -106, rU: 128, rA: 120 },
  jeteRun: { side: 1, y: 0, lT: -20, lS: 10, lF: 70, rT: 24, rS: 10, rF: 92, lU: -40, lA: -30, rU: 40, rA: 60 }
};
const mix = (a, b, t) => { const o = {}; const A = Object.assign({}, BASE, a), B = Object.assign({}, BASE, b); for (const k in BASE) o[k] = A[k] + (B[k] - A[k]) * t; o.side = B.side || A.side; return o; };

/* motions: a function of time (seconds) -> pose */
const MOTION = {
  plie: t => mix(P.seconde, P.plie, ease(.5 - .5 * Math.cos(t * 2.2))),
  releve: t => mix(P.haut, P.releve, ease(.5 - .5 * Math.cos(t * 2.2))),
  tendu: t => mix(P.sStand, P.tendu, ease(.5 - .5 * Math.cos(t * 2.4))),
  passe: t => mix(P.avant, P.passe, ease(.5 - .5 * Math.cos(t * 2))),
  arab: t => mix(P.sStand, P.arab, ease(Math.min(1, (t % 4) / 1.2))),
  att: t => mix(P.sStand, P.att, ease(Math.min(1, (t % 4) / 1.2))),
  jete: t => { const c = (t % 2.4) / 2.4; const air = Math.sin(Math.min(1, Math.max(0, (c - .25) / .5)) * Math.PI); const o = mix(P.jeteRun, P.jeteUp, air); o.x = -40 + c * 80; return o; },
  pirouette: t => { const o = mix(P.passe, P.passe, 0); o.y = -6; o.sx = Math.cos(t * 3.4); return o; },
  bas: () => mix(P.bas, P.bas, 0), avant: () => mix(P.avant, P.avant, 0), seconde: () => mix(P.seconde, P.seconde, 0), haut: () => mix(P.haut, P.haut, 0)
};


function dancer(motion) {
  const s = document.createElementNS(SVGNS, 'svg'); s.setAttribute('viewBox', '-10 0 220 225'); s.style.width = '100%'; s.style.height = '100%';

/* ---------- camera pose recognition (MediaPipe Pose Landmarker, runs on the device) ---------- */
let landmarker = null;
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
async function startPose(video) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return { lmk: null, why: 'この ページでは カメラが つかえない' };
  let stream = null;
  try {
    stream = await Promise.race([navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false }), wait(10000).then(() => null)]);
  } catch (e) { return { lmk: null, why: 'カメラが きょかされなかった' }; }
  if (!stream) return { lmk: null, why: 'カメラの へんじが なかった' };
  video.srcObject = stream; await video.play().catch(() => {});
  try {
    if (!landmarker) {
      let vision = null;
      for (const u of [MP + '/vision_bundle.mjs', MP + '/+esm']) { try { vision = await import(u); break; } catch (e) {} }
      if (!vision) throw new Error('lib');
      const files = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
      const opts = d => ({ baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', delegate: d }, runningMode: 'VIDEO', numPoses: 1 });
      landmarker = await Promise.race([vision.PoseLandmarker.createFromOptions(files, opts('GPU')).catch(() => vision.PoseLandmarker.createFromOptions(files, opts('CPU'))), wait(20000).then(() => null)]);
    }
  } catch (e) { landmarker = null; }
  if (!landmarker) { stopPose(video); return { lmk: null, why: 'ポーズを みる しくみを よみこめなかった' }; }
  return { lmk: landmarker };
}
function stopPose(video) { try { (video.srcObject && video.srcObject.getTracks() || []).forEach(t => t.stop()); video.srcObject = null; } catch (e) {} }

/* segments: [from, to] landmarks for the child's own left/right (MediaPipe numbering) */
const SEG = { lUp: [11, 13], lFo: [13, 15], rUp: [12, 14], rFo: [14, 16], lTh: [23, 25], lSh: [25, 27], rTh: [24, 26], rSh: [26, 28] };
const SEG_LEN = { lUp: .55, lFo: .5, rUp: .55, rFo: .5, lTh: .8, lSh: .8, rTh: .8, rSh: .8 };
const TOL = 32;
const swapLR = seg => { const o = {}; for (const k in seg) o[(k[0] === 'l' ? 'r' : 'l') + k.slice(1)] = -seg[k]; return o; };
const angOf = (a, b) => Math.atan2(b.x - a.x, b.y - a.y) * 180 / Math.PI;   /* 0 = down, +90 = right */
const angDiff = (a, b) => { let d = a - b; while (d > 180) d -= 360; while (d < -180) d += 360; return d; };
/* hint for the worst segment */
function hintFor(k, mine, want) {
  const leg = /Th|Sh/.test(k), raise = Math.abs(want) > Math.abs(mine);
  if (leg && Math.abs(want) > 60) return raise ? 'もうちょっと あしを たかく あげよう！' : 'あしを すこし さげよう';
  if (leg && Math.abs(want) > 10) return 'ひざを もっと そとに まげよう！';
  if (leg) return 'たっている あしを まっすぐ しよう';
  if (Math.abs(want) > 120) return raise ? 'うでを もっと うえに あげよう！' : 'うでを すこし さげて まるく しよう';
  return raise ? 'うでを もうすこし あげよう' : 'うでを もうすこし さげよう';
}
function matchPose(lmk, video, cv, ring, msg, splash, P) {
  return new Promise(res => {
    const t0 = performance.now(); let held = 0, last = t0, lastHint = 0, lastSaid = '';
    ring.hidden = false;
    const variants = P.mirror ? [P.seg, swapLR(P.seg)] : [P.seg];
    const tick = now => {
      if (!video.isConnected) return res(false);
      const dt = now - last; last = now;
      const W = cv.width = video.videoWidth || 640, H = cv.height = video.videoHeight || 480;
      const g = cv.getContext('2d'); g.clearRect(0, 0, W, H);
      let score = 0, seen = false, worst = null;
      try {
        const r = lmk.detectForVideo(video, now);
        const raw = r && r.landmarks && r.landmarks[0];
        if (raw) {
          /* work in mirror space: what the child sees */
          const lm = raw.map(p => ({ x: 1 - p.x, y: p.y, v: p.visibility === undefined ? 1 : p.visibility }));
          const X = p => p.x * W, Y = p => p.y * H;
          const need = new Set(); Object.keys(P.seg).forEach(k => SEG[k].forEach(i => need.add(i)));
          seen = [...need].every(i => lm[i].v > .5);
          /* pick the variant (left or right leg) that fits better */
          let best = null;
          variants.forEach(v => {
            let good = 0, tot = 0, w = null;
            Object.entries(v).forEach(([k, want]) => {
              const [a, b] = SEG[k], mine = angOf(lm[a], lm[b]), d = Math.abs(angDiff(mine, want));
              tot++; if (d <= TOL) good++; else if (!w || d > w.d) w = { k, d, mine, want };
            });
            const sc = good / tot; if (!best || sc > best.sc) best = { sc, v, w };
          });
          score = best.sc; worst = best.w;
          /* the guide: target lines growing from the child's own shoulders and hips */
          const sh = { x: (lm[11].x + lm[12].x) / 2, y: (lm[11].y + lm[12].y) / 2 }, hp = { x: (lm[23].x + lm[24].x) / 2, y: (lm[23].y + lm[24].y) / 2 };
          const T = Math.hypot((sh.x - hp.x) * W, (sh.y - hp.y) * H) || H * .25;
          const tip = {};
          g.setLineDash([14, 10]); g.lineCap = 'round'; g.lineWidth = 16; g.strokeStyle = 'rgba(255,255,255,.55)';
          Object.entries(best.v).forEach(([k, want]) => {
            const [a] = SEG[k]; const from = /Fo|Sh/.test(k) ? tip[k[0] + (k[1] === 'F' ? 'Up' : 'Th')] || { x: X(lm[a]), y: Y(lm[a]) } : { x: X(lm[a]), y: Y(lm[a]) };
            const L = SEG_LEN[k] * T, to = { x: from.x + Math.sin(want * Math.PI / 180) * L, y: from.y + Math.cos(want * Math.PI / 180) * L };
            tip[k] = to; g.beginPath(); g.moveTo(from.x, from.y); g.lineTo(to.x, to.y); g.stroke();
          });
          g.setLineDash([]);
          /* the child's own body: green where it matches, pink where it does not */
          g.lineWidth = 9;
          [[11, 12], [11, 23], [12, 24], [23, 24]].forEach(([a, b]) => { g.strokeStyle = '#F2C46D'; g.beginPath(); g.moveTo(X(lm[a]), Y(lm[a])); g.lineTo(X(lm[b]), Y(lm[b])); g.stroke(); });
          Object.entries(SEG).forEach(([k, [a, b]]) => {
            const want = best.v[k];
            g.strokeStyle = want === undefined ? '#F2C46D' : (Math.abs(angDiff(angOf(lm[a], lm[b]), want)) <= TOL ? '#5BE39A' : '#FF6F9C');
            g.beginPath(); g.moveTo(X(lm[a]), Y(lm[a])); g.lineTo(X(lm[b]), Y(lm[b])); g.stroke();
          });
          g.fillStyle = '#F2C46D'; g.beginPath(); g.arc(X(lm[0]), Y(lm[0]), 10, 0, 7); g.fill();
        }
      } catch (e) {}
      const ok = seen && score >= .99 - (Object.keys(P.seg).length > 4 ? .13 : 0);   /* all lines, or 7 of 8 */
      held = ok ? held + dt : Math.max(0, held - dt * 1.5);
      const p = Math.min(1, held / 1000);
      ring.style.setProperty('--p', p);
      let text;
      if (!seen) text = 'あたまから あしまで うつるように はなれてね';
      else if (ok) text = 'そのまま キープ！';
      else text = worst ? hintFor(worst.k, worst.mine, worst.want) : 'しろい せんに からだを あわせよう';
      ring.textContent = text; msg.textContent = seen ? 'みどり＝できてる　ピンク＝もうすこし' : '';
      if (text !== lastSaid && now - lastHint > 3500 && now - t0 > 2500 && !ok) { lastHint = now; lastSaid = text; say(text); }
      if (p >= 1) { splash.hidden = false; return res(true); }
      if (now - t0 > 30000) return res(false);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ---------- 7. guessing quiz ---------- */
PLAY.quiz = async (area, done) => {
  const Q = [
    ['くるみわりにんぎょうは、なにを わる にんぎょう？', ['くるみ', 'たまご', 'いし'], 0, 'くるみの からを わる にんぎょうだよ。'],
    ['クララに くるみわりにんぎょうを くれたのは だれ？', ['サンタクロース', 'ドロッセルマイヤーおじさん', 'ねずみの おうさま'], 1, 'ふしぎな ドロッセルマイヤーおじさんが くれたよ。'],
    ['よなかに あらわれて、たたかったのは？', ['ねこ', 'いぬ', 'ねずみ'], 2, 'ねずみの おうさまと ねずみたちが あらわれたよ。'],
    ['おかしの くにで まっていたのは？', ['こんぺいとうの せい', 'ゆきだるま', 'まほうつかい'], 0, 'こんぺいとうの せいが むかえて くれたよ。']
  ];
  const line = h('div', 'say'), o = h('div', 'opts'), mark = h('div', 'big'); area.append(mark, line, o);
  for (const [q, opts, a, ex] of Q) {
    mark.textContent = '❓'; line.textContent = q + ' どれだと おもう？'; say(line.textContent); o.innerHTML = '';
    await new Promise(res => {
      let tried = false;
      opts.forEach((t, i) => { const b = btn('opt', t, () => {
        if (i === a) { b.classList.add('right'); sfx.yay(); mark.textContent = '⭕'; line.textContent = (tried ? 'せいかい！ ' : 'あたり！ ') + ex; say(line.textContent); setTimeout(res, 3200); [...o.children].forEach(x => x.disabled = true); }
        else { tried = true; b.classList.add('wrong'); b.disabled = true; sfx.no(); say('おしい！ もう いちど えらんでね'); }
      }); o.appendChild(b); });
    });
    if (!o.isConnected) return;
  }
  done();
};

/* ---------- 8. sticker book ---------- */
PLAY.collect = (area, done) => {
  const got = GAMES.filter(g => child.done.has(g[0])).map(g => g[3]);
  const stickers = got.length ? got : ['⭐', '💂', '🍬'];
  const line = h('div', 'say', got.length ? 'あつめた シールを、ぶたいに はってね。ゆびで うごかせるよ' : 'シールを ぶたいに はってね。ほかの あそびを すると シールが ふえるよ'); say(line.textContent);
  const st = h('div', 'stage'); st.style.background = 'linear-gradient(#3B2A5A 0 70%, #C9A27A 70% 100%)';
  const curtain = h('div', ''); curtain.style.cssText = 'position:absolute;inset:0;background:linear-gradient(90deg,#B0203A 0 12%,transparent 12% 88%,#B0203A 88%);pointer-events:none'; st.appendChild(curtain);
  const tray = h('div', 'row'); let placed = 0;
  const fin = btn('go', 'できた！ ▶', done); fin.hidden = true;
  stickers.concat(['⭐', '🌸', '✨']).forEach(e => {
    const b = btn('tile', '', () => {
      const s = h('div', 'sticker', e); s.style.left = (25 + Math.random() * 50) + '%'; s.style.top = (30 + Math.random() * 40) + '%'; st.appendChild(s); sfx.pop();
      s.addEventListener('pointerdown', ev => { s.setPointerCapture(ev.pointerId); const r = st.getBoundingClientRect();
        const mv = m => { s.style.left = ((m.clientX - r.left) / r.width * 100) + '%'; s.style.top = ((m.clientY - r.top) / r.height * 100) + '%'; };
        const up = () => { s.removeEventListener('pointermove', mv); s.removeEventListener('pointerup', up); };
        s.addEventListener('pointermove', mv); s.addEventListener('pointerup', up); });
      if (++placed >= 3) fin.hidden = false;
    });
    b.style.minHeight = '64px'; b.style.padding = '6px 10px'; b.appendChild(h('span', 'e', e)); b.querySelector('.e').style.fontSize = '34px'; tray.appendChild(b);
  });
  area.append(line, st, tray, fin);
};

hub();
})();
