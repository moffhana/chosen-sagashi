  </section>

  ['余裕', '予定より5分早く動く', '何もしない時間を、半日作る', '予定を詰めこみすぎない1週間を計画して、守る'],
  ['シンプル', '使っていない物を、1つ手放す', '持ち物やアプリを見直して、減らす', '1週間、物を増やさずに過ごす'],
  ['世界', '外国のニュースを、1つ読む', 'オンラインなどで、外国の人と話す', '留学や海外研修の説明会に申し込む'],
  ['夢', '夢を1行で書く', '夢を叶えた人の道のりを調べる', '夢を人に話して、最初の一歩を実行する'],
  ['希望', '楽しみなことを、3つ書く', '1年後の自分に、手紙を書く', '叶えたいことの計画を立てて、人に話す'],
  ['ひらめき', '思いついたことを、メモに5つ書く', '散歩しながら、アイデアを考える', 'ひらめいたことを形にして、人に見せる'],
  ['感性', '好きな色・音・におい・景色を書き出す', '美術館や音楽会に行く', '感じたことを作品にして、発表する'],
  ['ありのまま', '自分のいいところを、3つ書く', '無理に合わせずに「私はこう思う」と言ってみる', '本当に好きなことを、人前で話す']
];
const DATA = {};
CARDS.forEach(([tag, ume, take, matsu]) => { DATA[tag] = { ume: [ume], take: [take], matsu: [matsu] }; });
const CARD_COUNT = CARDS.length;
function addOwn(word) {
  DATA[word] = {
    ume: ['今日、#' + word + ' を感じた瞬間を1つメモする'],
    take: ['#' + word + ' を大事にしている人に、どうしてか話を聞く'],
    matsu: ['#' + word + ' をテーマに、自分で小さな企画を1つやってみる'],
    own: true
  };
}
const COMBOS = [
  { tags: ['挑戦', '勇気'], matsu: 'ずっと迷っていたことに、今週中に申し込む' },
  { tags: ['冒険', '出会い'], matsu: '一人で知らない町のイベントに行って、地元の人と話す' },
  { tags: ['好奇心', '学び'], take: '大学や博物館の無料講座に参加する' },
  { tags: ['創造', '表現'], take: '作ったものをSNSや友達に見せて、感想をもらう' },
  { tags: ['仲間', '協力'], matsu: '仲間とチームを組んで、コンテストやイベントに出る' },
  { tags: ['家族', '感謝'], ume: '家族に「いつもありがとう」とメッセージを送る' },
  { tags: ['地域', '貢献'], take: '地域の清掃やお祭りの手伝いに参加する' },
  { tags: ['世界', '多様性'], matsu: '国際交流イベントや留学生との交流会に参加する' },
  { tags: ['夢', '行動'], ume: '夢に向けて、今日5分でできることを1つやる' },
  { tags: ['お金', '自立'], take: '1週間、使ったお金を全部記録してみる' },
  { tags: ['友情', '冒険'], take: '友達と、行ったことのない場所へ出かける' },
  { tags: ['健康', '継続'], take: '1週間、毎日10分歩くか体を動かす' }
];
const MAX = 3;
const state = { tags: ['挑戦', '好奇心'], level: 'all', picked: null, q: '' };

const chipsEl = document.getElementById('chips');
const segEl = document.getElementById('seg');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const toastEl = document.getElementById('toast');

function results() {
  const levels = state.level === 'all' ? ['ume', 'take', 'matsu'] : [state.level];
  const out = [];
  COMBOS.forEach(c => {
    if (c.tags.every(t => state.tags.includes(t))) {
      levels.forEach(lv => { if (c[lv]) out.push({ lv, text: c[lv], tags: c.tags, combo: true }); });
    }
  });
  state.tags.forEach(t => levels.forEach(lv => DATA[t][lv].forEach(text => out.push({ lv, text, tags: [t] }))));
  const order = { ume: 0, take: 1, matsu: 2 };
  return out.sort((a, b) => order[a.lv] - order[b.lv] || (b.combo ? 1 : 0) - (a.combo ? 1 : 0));
}

function renderChips() {
  chipsEl.innerHTML = '';
  const q = state.q.trim().replace(/^#/, '');
  const keys = Object.keys(DATA).filter(t => state.tags.includes(t) || !q || t.includes(q));
  keys.forEach(tag => {
    const on = state.tags.includes(tag);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (DATA[tag].own ? ' mine' : ''); b.textContent = '#' + tag;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.disabled = !on && state.tags.length >= MAX;
    b.addEventListener('click', () => {
      state.tags = on ? state.tags.filter(t => t !== tag) : [...state.tags, tag];
      state.picked = null; render();
    });
    chipsEl.appendChild(b);
  });
  if (!keys.length) chipsEl.innerHTML = '<div class="count">そのカードは見つかりませんでした。別の言葉で探してみてね。</div>';
}

document.getElementById('search').addEventListener('input', e => { state.q = e.target.value; renderChips(); });

function renderSeg() {
  segEl.innerHTML = '';
  LEVELS.forEach(l => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', state.level === l.id ? 'true' : 'false');
    b.innerHTML = l.label + '<span>' + l.sub + '</span>';
    b.addEventListener('click', () => { state.level = l.id; render(); });
    segEl.appendChild(b);
  });
}

function label(lv) { return { ume: '梅', take: '竹', matsu: '松' }[lv]; }

function renderList() {
  const items = results();
  listEl.innerHTML = '';
  if (!state.tags.length) {
    countEl.textContent = '';
    listEl.innerHTML = '<div class="empty">上のハッシュタグを1つ以上選ぶと、ここに挑戦が出てきます。</div>';
    return;
  }
  countEl.textContent = items.length + '件見つかりました';
  items.forEach(it => {
    const key = it.lv + '|' + it.text;
    const card = document.createElement('div');
    card.className = 'card' + (state.picked === key ? ' picked' : '');
    const lv = document.createElement('div');
    lv.className = 'lv ' + it.lv; lv.textContent = label(it.lv);
    const text = document.createElement('div');
    text.className = 'text'; text.textContent = it.text;
    const meta = document.createElement('div');
    meta.className = 'meta';
    const tags = document.createElement('span');
    tags.className = 'tags';
    tags.textContent = it.tags.map(t => '#' + t).join(' ') + (it.combo ? '（組み合わせ）' : '');
    const pick = document.createElement('button');
    pick.type = 'button'; pick.className = 'pick';
    pick.textContent = state.picked === key ? 'これに決めた' : 'これにする';
    pick.addEventListener('click', () => choose(key, it.text));
    meta.append(tags, pick);
    card.append(lv, text, meta);
    listEl.appendChild(card);
  });
}

function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { toastEl.hidden = true; }, 2200);
}

function choose(key, text) {
  state.picked = key; renderList();
  const done = () => toast('決まり！ワークシートに書こう');
  try {
    navigator.clipboard.writeText(text).then(() => toast('コピーしました。ワークシートに書こう'), done);
  } catch (e) { done(); }
}

document.getElementById('random').addEventListener('click', () => {
  const items = results();
  if (!items.length) { toast('先にハッシュタグを選んでね'); return; }
  const it = items[Math.floor(Math.random() * items.length)];
  state.picked = it.lv + '|' + it.text; renderList();
  toast('おまかせ：' + label(it.lv) + '「' + it.text + '」');
});

function render() { renderChips(); renderSeg(); renderList(); }
render();
</script>
</body></html>
